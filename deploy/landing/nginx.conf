server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css text/javascript application/javascript image/svg+xml application/json;
  gzip_min_length 512;

  # nginx drops server-level add_header inside a location that sets its own, so the shared headers are repeated there.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  location = /vercel.json { return 404; }          # build config for Vercel, not content

  # install.sh is piped into bash: never serve a stale copy from a cache.
  location = /install.sh {
    default_type text/plain;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  location /assets/ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  # CSS/JS are referenced as ?v=<hash> (stamped by scripts/deploy-landing.sh), so a short TTL is enough.
  location ~* \.(css|js)$ {
    expires 5m;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
